name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Build ordinary Chat plugin archive
        run: python scripts/build_chatgpt_plugin.py
      - run: python -m pip wheel . --no-deps -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: cricket-wheel
          path: dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cricket-chatgpt-plugin
          path: dist/cricket-chatgpt-plugin.tar.gz
          if-no-files-found: error
